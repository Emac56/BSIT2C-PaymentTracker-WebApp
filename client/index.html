<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSIT Payment &amp; Attendance Tracker</title>
<link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="/vendor/poppins/400.css">
<link rel="stylesheet" href="/vendor/poppins/600.css">
<link rel="stylesheet" href="/vendor/poppins/700.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top"><div class="wrap"><h1>BSIT Tracker</h1><p id="sub"></p></div></header>
<nav class="nav"><button data-v="home">Home</button><button data-v="pay">Payments</button><button data-v="att">Attendance</button><button data-v="stu">Students</button></nav>
<main id="view" class="wrap"></main>
<div id="toast" class="toast d-none" role="status"></div>
<div id="modal" class="overlay d-none"></div>
<div id="err" class="overlay d-none"><div class="box"><h2>Something went wrong</h2><p id="errmsg" class="mut"></p><button class="btn-ct" id="retry">Retry</button><button class="btn-alt" id="close">Close</button></div></div>
<div id="loading" class="overlay d-none"><div class="spinner-border text-light" role="status" aria-label="Loading"></div></div>
<script src="/js/app.js"></script>
</body>
</html>
